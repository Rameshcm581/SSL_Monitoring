services:
  app_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: uptime_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - app_db
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  app_db_data:
